<!DOCTYPE html>
<html>
<head>
    <title>Lambertville Tree Models</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Load Mapbox CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        html,
        body,
        #map {
            height: 100%;
        }

        #about {
            position: absolute;
            left: 15px;
            top: 15px;
            max-width: 280px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        #about h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        #about p {
            line-height: 1.5;
            color: #34495e;
            font-size: 14px;
        }

        .mapboxgl-ctrl-top-right {
            top: 15px;
            right: 15px;
        }

        @media only screen and (max-width: 640px) {
            #about {
                top: auto;
                bottom: 15px;
                max-width: calc(100% - 60px);
                right: 15px;
            }

            #about h1 {
                font-size: 18px;
            }

            #about p {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="about">
        <h1>Lambertville Trees</h1>
        <p>3D tree visualization with size-based models and random variants</p>
    </div>

    <!-- Load Mapbox JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>

    <script>
        // CONFIGURATION - Update these values as needed
        const CONFIG = {
            mapboxAccessToken: 'pk.eyJ1IjoiZGVja2RvZyIsImEiOiJjbDl5YWJydXcwMnl6M3Jrbml2djd5ZTJtIn0.hFpqesRFKogZg_ku3KKS_A',
            mapStyle: 'mapbox://styles/deckdog/cmhpg30ke001u01rx9dda1l8i',
            mapCenter: [-74.9443887, 40.3657128], // Lambertville, NJ
            mapZoom: 18.46,
            mapPitch: 60,
            mapBearing: 21.6,
            tilesetUrl: 'mapbox://deckdog.cmhv0bthj2k0b1nn4ae4eh32y-05o4c',
            sourceLayerName: 'lambertville-trees-v1',
            // Model paths
            // For local development, use: '../models'
            // For production: Uses current branch until merged to main
            modelBasePath: '../models'  // LOCAL TESTING MODE
        };

        // Access token
        mapboxgl.accessToken = CONFIG.mapboxAccessToken;

        // Initialize map
        const map = window.map = new mapboxgl.Map({
            container: 'map',
            center: CONFIG.mapCenter,
            zoom: CONFIG.mapZoom,
            pitch: CONFIG.mapPitch,
            bearing: CONFIG.mapBearing,
            style: CONFIG.mapStyle,
            minZoom: 15,
            maxZoom: 22,
            hash: true,
            antialias: true
        });

        const MODEL_VARIANTS = {
            'extra-large': 4,
            'large': 4,
            'medium': 4,
            'small': 4
        };

        const modelCache = new Map();

        const loadModel = (mapInstance, id, url) => {
            if (modelCache.has(id)) {
                try {
                    mapInstance.addModel(id, modelCache.get(id));
                    return Promise.resolve();
                } catch (error) {
                    if (error && typeof error.message === 'string' && error.message.includes('already exists')) {
                        return Promise.resolve();
                    }
                    return Promise.reject(error);
                }
            }

            return new Promise((resolve, reject) => {
                mapInstance.loadModel(url, (error, model) => {
                    if (error) {
                        reject(new Error(`Failed to load model ${id} from ${url}: ${error.message || error}`));
                        return;
                    }

                    modelCache.set(id, model);

                    try {
                        mapInstance.addModel(id, model);
                        resolve();
                    } catch (addError) {
                        reject(addError);
                    }
                });
            });
        };

        const registerTreeModels = async (mapInstance) => {
            const registrations = [];

            for (const [size, count] of Object.entries(MODEL_VARIANTS)) {
                for (let variant = 1; variant <= count; variant += 1) {
                    const modelId = `${size}-tree-${variant}`;
                    const modelUrl = `${CONFIG.modelBasePath}/${size}/${size}-tree-${variant}.glb`;
                    registrations.push(loadModel(mapInstance, modelId, modelUrl));
                }
            }

            await Promise.all(registrations);
        };

        const variantIndexExpression = [
            '%',
            ['abs', ['coalesce', ['number', ['id']], 0]],
            4
        ];

        const createVariantExpression = (values) => {
            return [
                'case',
                ['==', variantIndexExpression, 0], values[0],
                ['==', variantIndexExpression, 1], values[1],
                ['==', variantIndexExpression, 2], values[2],
                values[3]
            ];
        };

        const createModelExpressionBySize = () => {
            return [
                'case',
                ['==', ['get', 'type'], 'extra-large'], createVariantExpression([
                    'extra-large-tree-1',
                    'extra-large-tree-2',
                    'extra-large-tree-3',
                    'extra-large-tree-4'
                ]),
                ['==', ['get', 'type'], 'large'], createVariantExpression([
                    'large-tree-1',
                    'large-tree-2',
                    'large-tree-3',
                    'large-tree-4'
                ]),
                ['==', ['get', 'type'], 'medium'], createVariantExpression([
                    'medium-tree-1',
                    'medium-tree-2',
                    'medium-tree-3',
                    'medium-tree-4'
                ]),
                createVariantExpression([
                    'small-tree-1',
                    'small-tree-2',
                    'small-tree-3',
                    'small-tree-4'
                ])
            ];
        };

        const createColorExpression = () => {
            const palette = [
                ['rgba', 73, 107, 64, 1],
                ['rgba', 78, 116, 70, 1],
                ['rgba', 82, 123, 74, 1],
                ['rgba', 68, 100, 60, 1]
            ];

            return createVariantExpression(palette);
        };

        const createRotationExpression = () => {
            return createVariantExpression([
                ['literal', [0, 0, 0]],
                ['literal', [0, 0, 90]],
                ['literal', [0, 0, 180]],
                ['literal', [0, 0, 270]]
            ]);
        };

        // Handle map style loading
        map.on('style.load', () => {
            registerTreeModels(map)
                .then(() => {
                    if (!map.getSource('lambertvilleTrees')) {
                        map.addSource('lambertvilleTrees', {
                            'type': 'vector',
                            'url': CONFIG.tilesetUrl
                        });
                    }

                    if (!map.getLayer('tree-layer')) {
                        map.addLayer({
                            'id': 'tree-layer',
                            'type': 'model',
                            'slot': 'middle',
                            'source': 'lambertvilleTrees',
                            'source-layer': CONFIG.sourceLayerName,
                            'layout': {
                                'model-id': createModelExpressionBySize()
                            },
                            'paint': {
                                'model-color': createColorExpression(),
                                'model-color-mix-intensity': 0.21,
                                'model-rotation': createRotationExpression(),
                                'model-scale': [
                                    'match',
                                    ['get', 'type'],
                                    'extra-large', ['literal', [1.3, 1.3, 1.3]],
                                    'large', ['literal', [1.0, 1.0, 1.0]],
                                    'medium', ['literal', [0.75, 0.75, 0.75]],
                                    'small', ['literal', [0.5, 0.5, 0.5]],
                                    ['literal', [1, 1, 1]]
                                ],
                                'model-cast-shadows': true
                            },
                            'minzoom': 15,
                            'maxzoom': 22
                        });
                    }
                })
                .catch((error) => {
                    console.error(error);
                });
        });

        // Performance optimization
        map.on('idle', () => {
            map.repaint = false;
        });

        map.on('move', () => {
            map.repaint = true;
        });
    </script>
</body>
</html>
