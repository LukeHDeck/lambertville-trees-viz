<!DOCTYPE html>
<html>
<head>
    <title>Lambertville Tree Models</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Load Mapbox CSS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        html,
        body,
        #map {
            height: 100%;
        }

        #about {
            position: absolute;
            left: 15px;
            top: 15px;
            max-width: 280px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        #about h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        #about p {
            line-height: 1.5;
            color: #34495e;
            font-size: 14px;
        }

        .mapboxgl-ctrl-top-right {
            top: 15px;
            right: 15px;
        }

        @media only screen and (max-width: 640px) {
            #about {
                top: auto;
                bottom: 15px;
                max-width: calc(100% - 60px);
                right: 15px;
            }

            #about h1 {
                font-size: 18px;
            }

            #about p {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="about">
        <h1>Lambertville Trees</h1>
        <p>3D tree visualization with size-based models and random variants</p>
    </div>

    <!-- Load Mapbox JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>

    <script>
        // CONFIGURATION - Update these values as needed
        const CONFIG = {
            mapboxAccessToken: 'pk.eyJ1IjoiZGVja2RvZyIsImEiOiJjbDl5YWJydXcwMnl6M3Jrbml2djd5ZTJtIn0.hFpqesRFKogZg_ku3KKS_A',
            mapStyle: 'mapbox://styles/deckdog/cmhpg30ke001u01rx9dda1l8i',
            mapCenter: [-74.9443887, 40.3657128], // Lambertville, NJ
            mapZoom: 18.46,
            mapPitch: 60,
            mapBearing: 21.6,
            tilesetUrl: 'mapbox://deckdog.cmhv0bthj2k0b1nn4ae4eh32y-05o4c',
            sourceLayerName: 'lambertville-trees-v1',
            // Model paths - Update USERNAME with your GitHub username
            // For local development, use: '../models'
            // For production, use: 'https://raw.githubusercontent.com/USERNAME/lambertville-trees-viz/main/models'
            modelBasePath: 'https://raw.githubusercontent.com/LukeHDeck/lambertville-trees-viz/main/models'
        };

        // Access token
        mapboxgl.accessToken = CONFIG.mapboxAccessToken;

        // Initialize map
        const map = window.map = new mapboxgl.Map({
            container: 'map',
            center: CONFIG.mapCenter,
            zoom: CONFIG.mapZoom,
            pitch: CONFIG.mapPitch,
            bearing: CONFIG.mapBearing,
            style: CONFIG.mapStyle,
            minZoom: 15,
            maxZoom: 22,
            hash: true,
            antialias: true
        });

        // Helper function to create tree model selection expression based on size type
        const createModelExpressionBySize = () => {
            return [
                "case",
                // Extra-large trees
                ["==", ["get", "type"], "extra-large"],
                [
                    "case",
                    ["==", ["%", ["number", ["id"]], 4], 0], `${CONFIG.modelBasePath}/extra-large/extra-large-tree-1.glb`,
                    ["==", ["%", ["number", ["id"]], 4], 1], `${CONFIG.modelBasePath}/extra-large/extra-large-tree-2.glb`,
                    ["==", ["%", ["number", ["id"]], 4], 2], `${CONFIG.modelBasePath}/extra-large/extra-large-tree-3.glb`,
                    `${CONFIG.modelBasePath}/extra-large/extra-large-tree-4.glb`
                ],
                // Large trees
                ["==", ["get", "type"], "large"],
                [
                    "case",
                    ["==", ["%", ["number", ["id"]], 4], 0], `${CONFIG.modelBasePath}/large/large-tree-1.glb`,
                    ["==", ["%", ["number", ["id"]], 4], 1], `${CONFIG.modelBasePath}/large/large-tree-2.glb`,
                    ["==", ["%", ["number", ["id"]], 4], 2], `${CONFIG.modelBasePath}/large/large-tree-3.glb`,
                    `${CONFIG.modelBasePath}/large/large-tree-4.glb`
                ],
                // Medium trees
                ["==", ["get", "type"], "medium"],
                [
                    "case",
                    ["==", ["%", ["number", ["id"]], 4], 0], `${CONFIG.modelBasePath}/medium/medium-tree-1.glb`,
                    ["==", ["%", ["number", ["id"]], 4], 1], `${CONFIG.modelBasePath}/medium/medium-tree-2.glb`,
                    ["==", ["%", ["number", ["id"]], 4], 2], `${CONFIG.modelBasePath}/medium/medium-tree-3.glb`,
                    `${CONFIG.modelBasePath}/medium/medium-tree-4.glb`
                ],
                // Small trees (default)
                [
                    "case",
                    ["==", ["%", ["number", ["id"]], 4], 0], `${CONFIG.modelBasePath}/small/small-tree-1.glb`,
                    ["==", ["%", ["number", ["id"]], 4], 1], `${CONFIG.modelBasePath}/small/small-tree-2.glb`,
                    ["==", ["%", ["number", ["id"]], 4], 2], `${CONFIG.modelBasePath}/small/small-tree-3.glb`,
                    `${CONFIG.modelBasePath}/small/small-tree-4.glb`
                ]
            ];
        };

        // Handle map style loading
        map.on('style.load', () => {
            // Add the trees tileset source
            map.addSource('lambertvilleTrees', {
                'type': 'vector',
                'url': CONFIG.tilesetUrl
            });

            // Add the tree layer with size-based models
            map.addLayer({
                'id': 'tree-layer',
                'type': 'model',
                'slot': 'middle',
                'source': 'lambertvilleTrees',
                'source-layer': CONFIG.sourceLayerName,
                'layout': {
                    'model-id': createModelExpressionBySize()
                },
                'paint': {
                    // Random color variation for visual interest
                    "model-color": [
                        "hsla",
                        ["random", 50, 200, ["id"]],
                        60,
                        ["random", 70, 90, ["id"]],
                        1
                    ],
                    "model-color-mix-intensity": 0.21,
                    // Random rotation for natural appearance
                    "model-rotation": [
                        0, 0, ["random", 0, 360, ["id"]]
                    ],
                    // Scale based on tree size type
                    "model-scale": [
                        "match",
                        ["get", "type"],
                        "extra-large", ["literal", [1.3, 1.3, 1.3]],
                        "large", ["literal", [1.0, 1.0, 1.0]],
                        "medium", ["literal", [0.75, 0.75, 0.75]],
                        "small", ["literal", [0.5, 0.5, 0.5]],
                        ["literal", [1, 1, 1]]
                    ],
                    "model-cast-shadows": true
                },
                "minzoom": 15,
                "maxzoom": 22
            });
        });

        // Performance optimization
        map.on('idle', () => {
            map.repaint = false;
        });

        map.on('move', () => {
            map.repaint = true;
        });
    </script>
</body>
</html>
